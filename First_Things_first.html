              <div id="imgGrid2">
                <img class="img-item" src="Scan 7.png" alt="1">
                <img class="img-item" src="scan 1.jpg" alt="2">
                <img class="img-item" src="scan 2.jpg" alt="3">

              </div>
      
              <script>const images = document.querySelectorAll("#imgGrid2 img");

                images.forEach(img => {
                  img.addEventListener("click", () => {
                
                    // close any other open image
                    images.forEach(i => {
                      if (i !== img) {
                        i.classList.remove("enlarged");
                      }
                    });
                
                    // toggle clicked image
                    img.classList.toggle("enlarged");
                  });
                });</script>
