<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keti's World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double:wght@100..900&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
      font-family: "Bitcount Prop Double", sans-serif;


    }

    .bitcount-prop-double {
      font-family: "Bitcount Prop Double", sans-serif;
      font-optical-sizing: auto;
  font-weight: 400;

  font-style: normal;}
    
 
    .splash-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      cursor: pointer;
      font-family: "Bitcount Prop Double", sans-serif;
      transition-timing-function: ease-out;
      
    }


    #splash-svg {
      width: 600px;
      height: 600px;
    }

  

    #cw {
      animation: spinCW 18s linear infinite;
      transform-origin: center;
      transform-origin: 150px 150px;
      font-family: "Bitcount Prop Double", sans-serif;
      font-optical-sizing: auto;
      font-weight: 140; }
    


    #ccw {
      animation: spinCCW 26s linear infinite;
      transform-origin: center;
      font-family: "Bitcount Prop Double", sans-serif;
  font-optical-sizing: auto;
  font-weight: 140; 
}

    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }


    .star {
      position: fixed;
      top: -10px;
      color: rgb(255, 0, 204);
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }


    .nav {
      font-family: "Bitcount Prop Double", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
      font-style: normal;
      position: absolute;
      bottom: 40%;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      font: monospace;
    }

    .nav.show {
      font-family: "Bitcount Prop Double", sans-serif;
  font-optical-sizing: auto;
  font-weight: 100;
  font-style: normal;
  opacity: 1;
  pointer-events: auto;
  transition: opacity 0.8s ease;
    }

    .nav a {
      font-family: "Pixelify Sans", sans-serif;
      font-optical-sizing: auto;
      font-style: normal;
      display: block;
      margin: 20px 0;
      font-size: 25px;
      text-decoration: none;
      color: rgb(255, 0, 204);
      transition: opacity 0.8s ease;
    }
.text{
  font-family: "Pixelify Sans", sans-serif;
  font-optical-sizing: auto;
  font-weight: 100;
  font-style: normal;
      display: block;
      margin: 12px 0;
      text-decoration: none;
      color: rgb(255, 0, 204);
      transition: opacity 0.8s ease;
    
}

.shadow{
  text-decoration: none;
    color: rgb(231, 0, 181);
    transition: text-shadow 0.3s ease-in-out;
}
    .shadow:hover {
  
  text-shadow:2px 2px 5px rgb(189, 9, 111), -2px -2px 5px rgb(189, 9, 111), 2px -2px 5px rgb(189, 9, 111), -2px 2px 5px rgb(189, 9, 111);
  transition: text-shadow 0.3s ease-in;
}

  #nav a:hover {
    text-shadow:2px 2px 5px rgba(189, 9, 111, 0.486), -2px -2px 5px rgb(189, 9, 111), 2px -2px 5px rgb(189, 9, 111), -2px 2px 5px rgb(189, 9, 111);
    transition: text-shadow 0.3s ease-in;

  }
    

  #splash a:hover {
    text-shadow:2px 2px 5px rgba(189, 9, 111, 0.486), -2px -2px 5px rgb(189, 9, 111), 2px -2px 5px rgb(189, 9, 111), -2px 2px 5px rgb(189, 9, 111);
    transition: text-shadow 0.3s ease-in;

  }
  .text a {
  transition: opacity 0.8s ease;
}

.text a.clicked {
  opacity: 0;
}

   </style>

</head>

<body>

  <div class="splash-screen" id="splash">
    <svg id="splash-svg" viewBox="0 0 300 300" xml:space="preserve">
      <defs>
        <path id="innerCirclePath" d="M 150, 150 m -100, 0 a 100,100 0 1,1 200,0 a 100,100 0 1,1 -200,0"/>
        <path id="outerCirclePath" d="M 150, 150 m -130, 0 a 130,130 0 1,1 260,0 a 130,130 0 1,1 -260,0"/>
      </defs>


      <g id="cw">
        <text font-size="40.4" fill="rgb(255, 0, 204)">
          <textPath xlink:href="#innerCirclePath" startOffset="0%">
            <a> KETI'S WORLD ************** </a> 
          </textPath>
        </text>
      </g>


      <g id="ccw">
        <text font-size="30.4" fill="rgb(255, 0, 204)">
          <textPath xlink:href="#outerCirclePath" startOffset="0%">
            **********************************************************************************************************************************************************
          </textPath>
        </text>
      </g>
    </svg>
  </div>


  <nav class="nav" id="nav">
    <a href="projects.html"> ++ Work ++ </a>
    <a href="about.html"> About Keti  </a>
    <a href="https://www.instagram.com/ketisphotos/?hl=en">  More Work </a>
  </nav>
</a>
  <script>

    const splash = document.getElementById("splash");
    const nav = document.getElementById("nav");

    splash.addEventListener("click", () => {
      nav.classList.toggle("show");
    });


    function stars() {
      const star = document.createElement("div");
      star.className = "star";
      star.textContent = "+";
      star.style.left = Math.random() * innerWidth + "px";
      star.style.fontSize = Math.random() * 10 + 10 + "px";
      star.style.animationDuration = Math.random() * 3 + 3 + "s";
      document.body.appendChild(star);

      setTimeout(() => star.remove(), 7000);
    }

    setInterval(stars, 400);

 
  </script>

</body>
</html>
